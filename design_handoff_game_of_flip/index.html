<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game of Flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:  #0c0b09;
    --paper-2:#16140f;
    --paper-3:#1f1c17;
    --ink:    #f4ede0;
    --ink-mute:#8a8378;
    --rule:   rgba(244,237,224,0.18);
    --rule-2: rgba(244,237,224,0.10);
    --red:    #ff2a1f;
    --lime:   #d4ff3a;
    --yellow: #f6d738;
  }
  html, body { margin: 0; padding: 0; background: #07060a; color: var(--ink); height: 100%; overflow: hidden; }
  body {
    font-family: 'Space Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { cursor: pointer; font-family: inherit; }

  /* ─── Stage / background ─────────────────────────────────── */
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #07060a;
    overflow: hidden;
  }
  .stage-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 35%, rgba(255,42,31,0.12), transparent 60%),
      radial-gradient(ellipse 70% 50% at 75% 80%, rgba(212,255,58,0.06), transparent 65%),
      repeating-linear-gradient(0deg, rgba(244,237,224,0.025) 0px, rgba(244,237,224,0.025) 1px, transparent 1px, transparent 4px),
      #07060a;
  }
  .device-wrap {
    position: relative;
    z-index: 5;
    transform: scale(min(1, calc((100vh - 40px) / 874)));
    transform-origin: center;
  }

  /* ─── App root inside the iOS frame ──────────────────────── */
  .app-root {
    background: var(--paper);
    color: var(--ink);
    width: 100%; height: 100%;
    position: relative; overflow: hidden;
    font-family: 'Space Mono', monospace;
  }
  .screen {
    position: absolute; inset: 0;
    padding: 64px 16px 36px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .screen::-webkit-scrollbar { width: 0; }

  /* ─── Universal pieces ───────────────────────────────────── */
  .section-label {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 10px;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-mute); font-weight: 700;
  }
  .sl-num { font-family: 'Anton'; font-size: 18px; color: var(--ink); letter-spacing: 0.04em; }
  .sl-text { color: var(--ink); }
  .sl-meta { margin-left: auto; color: var(--ink-mute); font-size: 10px; }

  .back-btn {
    width: 36px; height: 36px; border-radius: 0;
    background: var(--paper-2); border: 1.5px solid var(--rule);
    color: var(--ink); display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .back-btn:hover { background: var(--paper-3); }

  /* ───────────────────────────────────────────────────────── */
  /*  HOME SCREEN                                              */
  /* ───────────────────────────────────────────────────────── */
  .home { padding-top: 70px; padding-bottom: 32px; display: flex; flex-direction: column; gap: 18px; }
  .home-marks { display: flex; justify-content: space-between; padding: 0 8px; align-items: center; }

  .home-title {
    position: relative;
    padding: 16px 0 12px;
    text-align: center;
  }
  .hero-line {
    font-family: 'Anton', Impact, sans-serif;
    font-weight: 400;
    color: var(--ink);
    line-height: 0.85;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    font-size: 120px;
  }
  .hero-line.one { transform: rotate(-1deg); }
  .hero-line.two {
    color: var(--ink);
    -webkit-text-stroke: 2px var(--ink);
    color: transparent;
    transform: rotate(1deg);
    margin-top: -4px;
  }
  .hero-of {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    margin: -2px 0 -2px;
  }
  .of-rule { flex: 1; max-width: 70px; height: 2px; background: var(--ink); }
  .of-word {
    font-family: 'Anton'; font-size: 22px; letter-spacing: 0.12em;
    color: var(--red); padding: 0 4px; line-height: 1;
  }
  .home-sub {
    margin: 14px 24px 0;
    font-size: 12px; line-height: 1.55; color: var(--ink-mute);
    letter-spacing: 0.02em;
  }
  .home-sub .sub-em { color: var(--ink); }

  .home-cta {
    margin: 8px 16px 4px;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .home-cta > * { width: 100%; }

  .home-foot {
    margin-top: 8px;
    border-top: 1.5px dashed var(--rule);
    padding: 20px 12px 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .how-row { display: flex; }
  .how-list {
    list-style: none; padding: 0; margin: 4px 0 0;
    display: flex; flex-direction: column; gap: 8px;
    font-size: 12px; color: var(--ink); line-height: 1.45;
  }
  .how-list li { display: flex; gap: 10px; align-items: baseline; }
  .how-num {
    font-family: 'Anton'; font-size: 18px;
    color: var(--lime); letter-spacing: 0.04em;
    min-width: 22px;
  }
  .how-list em { font-style: normal; color: var(--red); font-weight: 700; }
  .home-credits {
    display: flex; gap: 6px; justify-content: center;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute); padding-top: 4px;
  }

  /* ───────────────────────────────────────────────────────── */
  /*  SETUP SCREEN                                             */
  /* ───────────────────────────────────────────────────────── */
  .setup { padding-top: 60px; padding-bottom: 40px; display: flex; flex-direction: column; gap: 22px; }
  .screen-header {
    display: flex; align-items: center; justify-content: space-between;
    margin: -8px 0 0;
  }
  .screen-head-stamp { display: flex; justify-content: center; flex: 1; }

  .setup-section { display: flex; flex-direction: column; gap: 8px; }

  /* Roster */
  .player-grid {
    display: flex; flex-direction: column; gap: 6px;
  }
  .player-chip, .player-input {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    padding: 10px 12px;
    position: relative;
  }
  .player-chip:nth-child(odd) { transform: translateX(-1px) rotate(-0.15deg); }
  .player-chip:nth-child(even){ transform: translateX(1px) rotate(0.15deg); }

  .pc-num {
    font-family: 'Anton'; font-size: 18px; color: var(--ink-mute);
    letter-spacing: 0.04em; min-width: 22px;
  }
  .pc-name {
    flex: 1; color: var(--ink);
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.02em;
  }
  .pc-x {
    width: 24px; height: 24px; border: none; background: transparent;
    color: var(--ink-mute); display: flex; align-items: center; justify-content: center;
  }
  .pc-x:hover { color: var(--red); }

  .player-input input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--ink); font-family: 'Space Mono', monospace;
    font-size: 14px; font-weight: 700;
    padding: 0;
  }
  .player-input input::placeholder { color: var(--ink-mute); font-weight: 400; }
  .player-input { border-style: dashed; }
  .pc-add {
    width: 28px; height: 24px;
    background: var(--lime); border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pc-add:disabled { background: var(--paper-3); cursor: default; }

  /* Mode grid */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mode-card {
    position: relative; text-align: left;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    color: var(--ink);
    padding: 14px 12px; min-height: 110px;
    display: flex; flex-direction: column; gap: 4px;
    transition: border-color 100ms, background 100ms, transform 100ms;
  }
  .mode-card.on {
    background: var(--paper-3);
    border-color: var(--ink);
    box-shadow: 4px 4px 0 var(--lime);
  }
  .mc-tag {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .mc-title {
    font-family: 'Anton'; font-size: 30px; line-height: 1;
    color: var(--ink); letter-spacing: 0.02em; margin: 2px 0 6px;
  }
  .mc-desc { font-size: 10.5px; color: var(--ink-mute); line-height: 1.5; }
  .mc-active-stamp { position: absolute; top: 6px; right: 6px; }

  /* Tiers */
  .tier-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tier-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    color: var(--ink-mute);
    padding: 10px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    text-align: left;
  }
  .tier-chip.on {
    color: var(--ink); border-color: var(--tc); background: var(--paper-3);
  }
  .tc-dot {
    width: 10px; height: 10px; display: inline-block; background: var(--tc);
  }
  .tier-chip:not(.on) .tc-dot { opacity: 0.45; }
  .tc-label { flex: 1; }
  .tc-count { font-size: 10px; color: var(--ink-mute); }

  /* Picker */
  .picker-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .picker-opt {
    background: var(--paper-2); border: 1.5px solid var(--rule);
    color: var(--ink); text-align: left; padding: 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .picker-opt.on {
    background: var(--paper-3); border-color: var(--ink);
    box-shadow: 3px 3px 0 var(--red);
  }
  .po-title { font-family: 'Anton'; font-size: 18px; letter-spacing: 0.04em; }
  .po-desc { font-size: 10px; color: var(--ink-mute); line-height: 1.45; }

  /* CTA */
  .setup-cta { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .setup-foot-note {
    font-size: 10px; color: var(--ink-mute);
    text-align: center; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .setup-foot-note strong { color: var(--ink); }

  /* ───────────────────────────────────────────────────────── */
  /*  MATCH SCREEN                                             */
  /* ───────────────────────────────────────────────────────── */
  .match { padding-top: 56px; padding-bottom: 28px; display: flex; flex-direction: column; gap: 12px; }

  .match-head {
    display: flex; align-items: center; gap: 10px;
    margin-top: -4px;
  }
  .match-head-center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .mh-mode {
    font-family: 'Anton'; font-size: 22px; letter-spacing: 0.06em;
    color: var(--ink); line-height: 1; white-space: nowrap;
  }
  .mh-round {
    font-size: 9px; letter-spacing: 0.22em; color: var(--ink-mute);
    white-space: nowrap;
  }
  .mh-setter {
    display: flex; flex-direction: column; gap: 1px; align-items: flex-end;
    border-left: 1.5px solid var(--rule);
    padding-left: 8px; flex-shrink: 0;
  }
  .mhs-tag { font-size: 9px; letter-spacing: 0.18em; color: var(--ink-mute); white-space: nowrap; }
  .mhs-name {
    font-family: 'Anton'; font-size: 16px; color: var(--lime); letter-spacing: 0.04em;
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Players strip */
  .players-strip {
    display: flex; gap: 6px;
    overflow-x: auto; overflow-y: hidden;
    padding: 2px 0 4px;
    margin: 0 -16px; padding-left: 16px; padding-right: 16px;
    scrollbar-width: none;
  }
  .players-strip::-webkit-scrollbar { display: none; }
  .p-pill {
    flex: 0 0 auto;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    padding: 6px 10px; min-width: 70px;
    display: flex; flex-direction: column; gap: 3px;
    position: relative;
  }
  .p-pill.setter { border-color: var(--lime); background: var(--paper-3); }
  .p-pill.out { opacity: 0.4; }
  .pp-name {
    font-size: 11px; font-weight: 700; color: var(--ink);
    letter-spacing: 0.02em; max-width: 86px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .pp-setter-dot {
    position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; background: var(--lime);
  }
  .pp-out-stamp {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton'; font-size: 16px; color: var(--red);
    letter-spacing: 0.04em; transform: rotate(-12deg);
    pointer-events: none;
  }

  /* Trick zone */
  .trick-zone {
    position: relative;
    background: var(--paper-2);
    border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 var(--red);
    padding: 14px 14px 12px;
    overflow: hidden;
  }
  .trick-zone.addon { box-shadow: 5px 5px 0 var(--lime); }
  .tz-corner-tag {
    position: absolute; top: 0; left: 0;
    background: var(--ink); color: var(--paper);
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.22em;
    padding: 3px 8px;
  }
  .tz-halftone { position: absolute; inset: 0; pointer-events: none; }
  .tz-main { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }
  .tz-tier-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 2px;
  }
  .tz-reroll-count {
    font-size: 9px; letter-spacing: 0.2em; color: var(--ink-mute);
  }
  .tz-trick-name {
    font-family: 'Anton', Impact, sans-serif;
    font-size: 44px; line-height: 0.92;
    color: var(--ink); letter-spacing: -0.005em;
    text-transform: uppercase;
    margin: 6px 0 6px;
    text-wrap: balance;
  }
  .tz-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tz-reroll, .tz-pick {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink); padding: 6px 10px 5px;
    font-family: 'Space Mono', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .tz-reroll:hover, .tz-pick:hover { background: var(--ink); color: var(--paper); }
  .tz-reroll:disabled { opacity: 0.4; cursor: not-allowed; }
  .tz-reroll.small, .tz-pick.small { padding: 5px 8px 4px; font-size: 10px; }

  /* Add-on list */
  .addon .combo-list {
    max-height: 200px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    margin: 8px 0 8px;
    position: relative; z-index: 2;
    padding-right: 4px;
    scrollbar-width: thin; scrollbar-color: var(--ink-mute) transparent;
  }
  .addon .combo-list::-webkit-scrollbar { width: 4px; }
  .addon .combo-list::-webkit-scrollbar-thumb { background: var(--ink-mute); }
  .combo-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    background: var(--paper);
    border: 1px solid var(--rule);
    font-size: 12px;
  }
  .combo-item.latest {
    background: var(--paper-3);
    border-color: var(--lime);
    box-shadow: 2px 2px 0 var(--lime);
    margin-bottom: 2px; margin-right: 2px;
  }
  .ci-num { font-family: 'Anton'; font-size: 16px; color: var(--ink-mute); min-width: 22px; letter-spacing: 0.04em; }
  .combo-item.latest .ci-num { color: var(--lime); }
  .ci-name {
    flex: 1; color: var(--ink); font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ci-new {
    background: var(--lime); color: var(--paper);
    font-size: 8px; font-weight: 700; letter-spacing: 0.16em;
    padding: 2px 5px 1px;
  }
  .addon-actions {
    display: flex; gap: 6px; align-items: center;
    position: relative; z-index: 2;
  }
  .addon-reroll-count {
    margin-left: auto; font-size: 9px; letter-spacing: 0.18em;
    color: var(--ink-mute); text-transform: uppercase;
  }

  /* Result rows */
  .result-rows {
    display: flex; flex-direction: column; gap: 5px;
    margin-top: 4px;
  }
  .rr-head {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 9px; letter-spacing: 0.22em; color: var(--ink-mute);
    text-transform: uppercase; padding: 0 2px 2px;
  }
  .rr-progress { color: var(--ink); font-family: 'Anton'; font-size: 14px; letter-spacing: 0.04em; }

  .result-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--paper-2);
    border: 1.5px solid var(--rule);
    transition: background 100ms, border-color 100ms;
  }
  .result-row.r-landed { border-color: var(--lime); background: rgba(212,255,58,0.06); }
  .result-row.r-missed { border-color: var(--red);  background: rgba(255,42,31,0.06); }

  .rr-player { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rr-name {
    font-size: 13px; font-weight: 700; color: var(--ink);
    letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .rr-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .rr-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--paper); color: var(--ink-mute);
    border: 1.5px solid var(--rule);
    padding: 6px 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .rr-btn.miss.on { background: var(--red); color: var(--paper); border-color: var(--red); }
  .rr-btn.land.on { background: var(--lime); color: var(--paper); border-color: var(--lime); }

  /* Setter row — emphasized */
  .result-row.is-setter {
    border-color: var(--lime);
    background: rgba(212,255,58,0.04);
    box-shadow: 3px 3px 0 var(--lime);
    margin-bottom: 2px; margin-right: 3px;
  }
  .result-row.is-setter.r-missed { box-shadow: 3px 3px 0 var(--red); border-color: var(--red); background: rgba(255,42,31,0.07); }
  .result-row.is-setter.r-landed { background: rgba(212,255,58,0.12); }
  .rr-setter-tag {
    display: inline-block;
    background: var(--lime); color: var(--paper);
    font-size: 8px; font-weight: 700; letter-spacing: 0.2em;
    padding: 1px 5px; margin-left: 6px;
    vertical-align: middle;
  }
  .result-row.is-setter.r-missed .rr-setter-tag { background: var(--red); color: var(--ink); }

  /* Disabled (gated) rows */
  .result-row.is-disabled { opacity: 0.4; }
  .result-row.is-disabled .rr-btn { cursor: not-allowed; }
  .rr-btn:disabled { cursor: not-allowed; }

  /* Set-failed banner */
  .set-failed {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: rgba(255,42,31,0.08);
    border: 2px dashed var(--red);
  }
  .sf-copy { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .sf-line1 {
    font-family: 'Anton'; font-size: 18px; color: var(--ink);
    letter-spacing: 0.02em; line-height: 1;
  }
  .sf-line2 {
    font-size: 10px; color: var(--ink-mute);
    letter-spacing: 0.06em; text-transform: uppercase;
    line-height: 1.35;
  }

  /* Proposed (not-yet-set) combo item */
  .combo-item.proposed {
    background: var(--paper-3);
    border-color: var(--lime);
    box-shadow: 2px 2px 0 var(--lime);
    margin: 2px 3px 2px 0;
  }
  .combo-item.proposed .ci-num { color: var(--lime); }
  .ci-prop {
    background: var(--lime); color: var(--paper);
    font-size: 8px; font-weight: 700; letter-spacing: 0.16em;
    padding: 2px 5px 1px;
  }
  .combo-empty {
    padding: 12px 10px; color: var(--ink-mute);
    font-size: 11px; letter-spacing: 0.04em;
    border: 1.5px dashed var(--rule);
  }

  .rr-out {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    background: transparent; border: 1.5px dashed var(--rule);
    opacity: 0.55;
  }
  .rr-out-name {
    font-size: 12px; color: var(--ink-mute);
    text-decoration: line-through;
    letter-spacing: 0.02em; font-weight: 700;
  }

  /* Match footer */
  .match-foot { margin-top: 4px; }

  /* ───────────────────────────────────────────────────────── */
  /*  GAME OVER                                                */
  /* ───────────────────────────────────────────────────────── */
  .gameover { padding-top: 56px; display: flex; flex-direction: column; gap: 18px; }
  .go-top { display: flex; justify-content: center; }
  .go-headline { text-align: center; padding: 8px 0 0; }
  .go-spelled {
    display: flex; justify-content: center; gap: 6px;
    margin-bottom: 4px;
  }
  .go-letter {
    font-family: 'Anton', Impact, sans-serif;
    font-size: 78px; line-height: 0.85;
    color: var(--red); letter-spacing: 0.02em;
  }
  .go-letter:nth-child(odd)  { transform: rotate(-3deg); }
  .go-letter:nth-child(even) { transform: rotate(3deg); }
  .go-who { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .go-who-name {
